<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <meta name="description" content="Welcome to my website.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #5f6368;
      --accent: #1f3864;
      --card: #f5f6f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #f1f1f1;
        --muted: #a0a4a8;
        --accent: #8ab4f8;
        --card: #1e1e1e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header, main, footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    nav a {
      margin-left: 16px;
      color: var(--text);
      text-decoration: none;
    }
    nav a:hover { color: var(--accent); }
    .hero { padding: 48px 0 32px; }
    .hero h1 { font-size: 2.2rem; margin: 0 0 12px; }
    .hero p { color: var(--muted); font-size: 1.1rem; max-width: 600px; }
    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }
    .card { background: var(--card); padding: 20px; border-radius: 8px; }
    .card h3 { margin-top: 0; }
    footer {
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--card);
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">My Website</div>
    <nav>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
